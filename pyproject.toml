[project]
name = "cerebro"
version = "0.1.0"
description = "A research agent for Marvel characters, teams and comics, plus the evaluation suite that measures it."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vijayaraghavan M", email = "mvijayaraghavan29@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-mistralai>=1.1.6",
    "langgraph>=1.2.20",
    "mwparserfromhell>=0.7.2",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "typer>=0.27.3",
]

[project.scripts]
cerebro = "cerebro.interfaces.cli:app"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not live"]
markers = ["live: calls a real external API; run with -m live"]
# Tests import shared helpers with `from helpers import ...`; say so here rather
# than rely on pytest's import mode putting the tests folder on the path.
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
