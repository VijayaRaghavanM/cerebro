[project]
name = "cerebro"
version = "0.1.0"
description = "A research agent for Marvel characters, teams and comics, plus the evaluation suite that measures it."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vijayaraghavan M", email = "mvijayaraghavan29@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not live"]
markers = ["live: calls a real external API and needs keys; run with -m live"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
